<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Moderno | Panel de Gestión</title>
    
    <!-- Fuentes modernas de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#0033a0',
                            cyan: '#00a1e0',
                            dark: '#0f172a',
                            light: '#f8fafc'
                        }
                    },
                    boxShadow: {
                        'soft': '0 20px 40px -15px rgba(0,0,0,0.05)',
                        'floating': '0 30px 60px -20px rgba(0,51,160,0.2)'
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background: linear-gradient(135deg, #0033a0 0%, #00a1e0 100%);
            background-attachment: fixed;
        }
        /* Estilos minimalistas para inputs */
        .input-modern {
            @apply w-full bg-slate-50 border-0 rounded-2xl px-5 py-3.5 text-gray-800 shadow-[inset_0_2px_4px_rgba(0,0,0,0.02)] focus:ring-2 focus:ring-brand-cyan focus:bg-white transition-all duration-300;
        }
        /* Etiquetas elegantes */
        .label-modern {
            @apply block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1;
        }
        /* Animaciones */
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Scrollbar invisible pero funcional */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen text-slate-800 p-4 md:p-8 flex items-center justify-center">

    <!-- Contenedor Principal (Tarjeta Flotante) -->
    <div class="max-w-4xl w-full bg-white rounded-[2.5rem] shadow-floating overflow-hidden relative fade-in">
        
        <!-- Header / Navegación por pestañas -->
        <div class="px-6 md:px-8 pt-8 pb-4 border-b border-slate-100 flex flex-col md:flex-row md:justify-between md:items-center bg-white/50 backdrop-blur-xl sticky top-0 z-10 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-brand-dark tracking-tight">Registro</h1>
                <p class="text-sm font-medium text-slate-400 mt-1">Gestión de potenciales clientes</p>
            </div>
            <div class="flex space-x-2 bg-slate-100 p-1.5 rounded-2xl self-start md:self-auto">
                <button onclick="switchTab('registro')" id="tab-registro" class="px-4 md:px-6 py-2.5 rounded-xl font-semibold text-sm transition-all duration-300 bg-white text-brand-blue shadow-sm">
                    Formulario
                </button>
                <button onclick="switchTab('dashboard')" id="tab-dashboard" class="px-4 md:px-6 py-2.5 rounded-xl font-semibold text-sm transition-all duration-300 text-slate-500 hover:text-brand-blue">
                    Dashboard
                </button>
            </div>
        </div>

        <!-- Alerta de Modo Edición -->
        <div id="alertaEdicion" class="hidden bg-brand-cyan/10 border-l-4 border-brand-cyan p-4 mx-4 md:mx-8 mt-6 rounded-r-2xl">
            <div class="flex items-center">
                <svg class="h-5 w-5 text-brand-cyan mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                <p class="text-sm font-bold text-brand-blue">Modo Edición Activado.</p>
                <button type="button" onclick="cancelarEdicion()" class="ml-auto text-xs font-bold text-slate-500 hover:text-brand-blue uppercase tracking-wider">Cancelar</button>
            </div>
        </div>

        <!-- CONTENIDO: PESTAÑA REGISTRO -->
        <div id="content-registro" class="p-6 md:p-8 fade-in">
            <form id="leadForm" class="space-y-6">
                <!-- Fila 1: ID, Fecha, Cédula -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="label-modern">ID Consulta</label>
                        <input type="text" id="idConsulta" name="idConsulta" class="input-modern bg-slate-100 text-slate-400 font-medium" readonly>
                    </div>
                    <div>
                        <label class="label-modern">Fecha de Registro</label>
                        <input type="date" id="fechaRegistro" name="fechaRegistro" class="input-modern bg-slate-100 text-slate-400 font-medium" readonly>
                    </div>
                    <div>
                        <label class="label-modern text-brand-blue">Cédula *</label>
                        <div class="relative">
                            <input type="number" id="cedula" name="cedula" required class="input-modern pr-14" placeholder="Ej. 1058139461">
                            <button type="button" onclick="buscarPorCedula()" class="absolute inset-y-1.5 right-1.5 bg-brand-blue hover:bg-brand-cyan text-white p-2 rounded-xl transition-colors shadow-md focus:outline-none focus:ring-2 focus:ring-brand-blue focus:ring-offset-1">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Fila 2: Nombre -->
                <div>
                    <label class="label-modern">Nombre Completo *</label>
                    <input type="text" id="nombre" name="nombre" required class="input-modern" placeholder="Ej. Nicol Dahianna Ortíz Ramirez">
                </div>

                <!-- Fila 3: POPC, CIFIN, Validación -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 bg-slate-50 p-6 rounded-[2rem] border border-slate-100">
                    <div>
                        <label class="label-modern">Número de POPC *</label>
                        <input type="text" id="numPOPC" name="numPOPC" required class="input-modern bg-white">
                    </div>
                    <div>
                        <label class="label-modern">Puntaje CIFIN *</label>
                        <input type="number" id="puntajeCIFIN" name="puntajeCIFIN" required class="input-modern bg-white">
                    </div>
                    <div>
                        <label class="label-modern">Validación CIFIN *</label>
                        <select id="validacionCIFIN" name="validacionCIFIN" required class="input-modern bg-white">
                            <option value="">Seleccionar...</option>
                            <option value="Cumple">Cumple</option>
                            <option value="No cumple">No cumple</option>
                            <option value="Cumple con pendiente">Cumple con pendiente</option>
                            <option value="PEPs">PEPs</option>
                        </select>
                    </div>
                </div>

                <!-- Fila 4: Empresa, Sector, Teléfono -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="label-modern">Empresa *</label>
                        <select id="empresa" name="empresa" required class="input-modern">
                            <option value="">Cargando empresas...</option>
                        </select>
                    </div>
                    <div>
                        <label class="label-modern">Sector *</label>
                        <select id="sector" name="sector" required class="input-modern">
                            <option value="">Seleccionar...</option>
                            <option value="Público">Público</option>
                            <option value="Privado">Privado</option>
                        </select>
                    </div>
                    <div>
                        <label class="label-modern">Teléfono *</label>
                        <input type="number" id="telefono" name="telefono" required class="input-modern" placeholder="Ej. 3007358997">
                    </div>
                </div>

                <!-- Fila 5: # OPC, Estado, Fecha Recuperación -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="label-modern"># OPC *</label>
                        <input type="text" id="numOPC" name="numOPC" required class="input-modern" placeholder="Ej. 2274044">
                    </div>
                    <div>
                        <label class="label-modern">Estado *</label>
                        <select id="estado" name="estado" required class="input-modern">
                            <option value="">Seleccionar...</option>
                            <option value="Recuperar">Recuperar</option>
                            <option value="Radicado">Radicado</option>
                            <option value="Reportado">Reportado</option>
                            <option value="Sin capacidad">Sin capacidad</option>
                            <option value="Pendiente por Radicar">Pendiente por Radicar</option>
                        </select>
                    </div>
                    <div id="divRecuperacion" class="hidden transform transition-all duration-300">
                        <label class="label-modern text-amber-500">Fecha Recuperación *</label>
                        <input type="date" id="fechaRecuperacion" name="fechaRecuperacion" class="input-modern bg-amber-50 border border-amber-200 focus:ring-amber-400">
                    </div>
                </div>

                <!-- Fila 6: Notas -->
                <div>
                    <label class="label-modern">Notas Adicionales</label>
                    <textarea id="notas" name="notas" rows="3" class="input-modern resize-none" placeholder="Observaciones sobre la documentación..."></textarea>
                </div>

                <!-- Botón Submit -->
                <div class="pt-6">
                    <button type="submit" id="btnSubmit" class="w-full bg-brand-dark hover:bg-brand-blue text-white font-bold text-lg py-4 rounded-2xl shadow-[0_10px_20px_-10px_rgba(0,51,160,0.5)] transition-all duration-300 flex justify-center items-center focus:outline-none focus:ring-4 focus:ring-brand-blue/30">
                        <span id="btnText">Guardar Registro</span>
                        <svg id="btnSpinner" class="hidden animate-spin ml-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    </button>
                    <div id="formFeedback" class="mt-4 text-center text-sm font-semibold hidden rounded-xl py-3 transition-opacity"></div>
                </div>
            </form>
        </div>

        <!-- CONTENIDO: PESTAÑA DASHBOARD -->
        <div id="content-dashboard" class="hidden p-4 md:p-8 fade-in">
            <div class="flex flex-col lg:flex-row justify-between items-center mb-8 bg-slate-50 p-4 rounded-2xl gap-4">
                <p class="text-sm font-semibold text-slate-500 text-center lg:text-left">Visualiza los registros guardados.</p>
                <div class="flex items-center bg-white p-1 rounded-xl shadow-sm w-full lg:w-auto">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest mx-3 whitespace-nowrap">Filtrar</label>
                    <select id="filtroEstado" onchange="renderizarTabla()" class="w-full lg:w-auto border-0 bg-transparent py-2 pl-2 pr-8 text-sm font-bold text-brand-dark focus:ring-0 cursor-pointer">
                        <option value="Todos">Todos</option>
                        <option value="Recuperar">Recuperar (Pendientes)</option>
                        <option value="Radicado">Radicado</option>
                        <option value="Reportado">Reportado</option>
                        <option value="Pendiente por Radicar">Pendiente por Radicar</option>
                        <option value="Sin capacidad">Sin capacidad</option>
                    </select>
                </div>
            </div>

            <!-- Tabla de datos responsive -->
            <div class="overflow-x-auto rounded-[2rem] border border-slate-100 shadow-sm bg-white">
                <table class="min-w-full divide-y divide-slate-100">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="px-6 py-4 text-left text-[11px] font-bold text-slate-400 uppercase tracking-widest">Cliente</th>
                            <th class="px-6 py-4 text-left text-[11px] font-bold text-slate-400 uppercase tracking-widest hidden md:table-cell">Empresa</th>
                            <th class="px-6 py-4 text-left text-[11px] font-bold text-slate-400 uppercase tracking-widest">Estado</th>
                            <th class="px-6 py-4 text-left text-[11px] font-bold text-slate-400 uppercase tracking-widest hidden sm:table-cell">Alerta</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo" class="bg-white divide-y divide-slate-50">
                        <tr>
                            <td colspan="4" class="px-6 py-12 text-center text-sm text-slate-400 font-medium">
                                Cargando información de la base de datos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Tostada de Notificaciones (Reemplaza a los alerts) -->
    <div id="toastNotification" class="fixed bottom-6 right-6 transform transition-all duration-300 translate-y-20 opacity-0 px-6 py-4 rounded-2xl text-sm font-bold text-white shadow-[0_10px_20px_rgba(0,0,0,0.1)] z-50 pointer-events-none flex items-center">
        <span id="toastIcon" class="mr-2"></span>
        <span id="toastMessage"></span>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyXKBS057EN36CPOpa07SyojvGl6wWLVWmfNzKjzAbAD92RH_FtSZpYFpB5e2yvEwd-gg/exec';
        let datosDashboard = [];
        let currentRowNumber = null;

        // INICIALIZACIÓN
        window.onload = () => {
            inicializarFormulario();
            cargarDatosBackend();
        };

        function showToast(message, type = 'error') {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');
            
            toastMsg.textContent = message;
            
            if(type === 'error') {
                toast.className = `fixed bottom-6 right-6 transform transition-all duration-300 px-6 py-4 rounded-2xl text-sm font-bold text-white shadow-xl z-50 flex items-center bg-rose-500 translate-y-0 opacity-100`;
                toastIcon.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            } else {
                toast.className = `fixed bottom-6 right-6 transform transition-all duration-300 px-6 py-4 rounded-2xl text-sm font-bold text-white shadow-xl z-50 flex items-center bg-emerald-500 translate-y-0 opacity-100`;
                toastIcon.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            }
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3500);
        }

        function inicializarFormulario() {
            if(!currentRowNumber) {
                document.getElementById('idConsulta').value = generarID();
                const today = new Date();
                today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
                document.getElementById('fechaRegistro').value = today.toISOString().slice(0, 10);
            }
        }

        function generarID() {
            const date = new Date();
            const prefix = date.getFullYear().toString() + 
                           String(date.getMonth() + 1).padStart(2, '0') + 
                           String(date.getDate()).padStart(2, '0');
            let consecutivo = parseInt(localStorage.getItem(`crm_consecutivo_${prefix}`) || 0) + 1;
            return `${prefix}-${String(consecutivo).padStart(2, '0')}`;
        }

        async function cargarDatosBackend() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                const selectEmpresa = document.getElementById('empresa');
                selectEmpresa.innerHTML = '<option value="">Seleccione una empresa</option>';
                if(data.empresas) {
                    data.empresas.forEach(emp => {
                        let opt = document.createElement('option');
                        opt.value = emp; opt.textContent = emp;
                        selectEmpresa.appendChild(opt);
                    });
                }
                if(data.registros) {
                    datosDashboard = data.registros;
                    renderizarTabla();
                }
            } catch (error) {
                console.error("Error cargando datos:", error);
                document.getElementById('empresa').innerHTML = '<option value="">Error cargando empresas</option>';
            }
        }

        function switchTab(tabId) {
            document.getElementById('content-registro').classList.add('hidden');
            document.getElementById('content-dashboard').classList.add('hidden');
            document.getElementById('tab-registro').className = 'px-4 md:px-6 py-2.5 rounded-xl font-semibold text-sm transition-all duration-300 text-slate-500 hover:text-brand-blue';
            document.getElementById('tab-dashboard').className = 'px-4 md:px-6 py-2.5 rounded-xl font-semibold text-sm transition-all duration-300 text-slate-500 hover:text-brand-blue';
            
            document.getElementById(`content-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).className = 'px-4 md:px-6 py-2.5 rounded-xl font-semibold text-sm transition-all duration-300 bg-white text-brand-blue shadow-sm';
        }

        const estadoSelect = document.getElementById('estado');
        const divRecuperacion = document.getElementById('divRecuperacion');
        const inputRecuperacion = document.getElementById('fechaRecuperacion');

        estadoSelect.addEventListener('change', function() {
            if (this.value === 'Recuperar') {
                divRecuperacion.classList.remove('hidden');
                inputRecuperacion.required = true;
            } else {
                divRecuperacion.classList.add('hidden');
                inputRecuperacion.required = false;
                inputRecuperacion.value = '';
            }
        });

        async function buscarPorCedula() {
            const cedulaBuscar = document.getElementById('cedula').value;
            if(!cedulaBuscar) return showToast("Ingrese una cédula para buscar.", "error");
            
            const btnBuscar = document.querySelector('button[onclick="buscarPorCedula()"]');
            btnBuscar.innerHTML = `<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'search', cedula: cedulaBuscar })
                });
                const result = await response.json();
                
                if(result.status === 'success' && result.data) {
                    const d = result.data;
                    document.getElementById('idConsulta').value = d.idConsulta;
                    document.getElementById('fechaRegistro').value = d.fechaRegistro ? d.fechaRegistro.split('T')[0] : '';
                    document.getElementById('numPOPC').value = d.numPOPC;
                    document.getElementById('puntajeCIFIN').value = d.puntajeCIFIN;
                    document.getElementById('validacionCIFIN').value = d.validacionCIFIN;
                    document.getElementById('empresa').value = d.empresa;
                    document.getElementById('sector').value = d.sector;
                    document.getElementById('nombre').value = d.nombre;
                    document.getElementById('telefono').value = d.telefono;
                    document.getElementById('numOPC').value = d.numOPC;
                    document.getElementById('notas').value = d.notas;
                    document.getElementById('estado').value = d.estado;
                    
                    if(d.estado === 'Recuperar') {
                        divRecuperacion.classList.remove('hidden');
                        inputRecuperacion.required = true;
                        inputRecuperacion.value = d.fechaRecuperacion ? d.fechaRecuperacion.split('T')[0] : '';
                    } else {
                        divRecuperacion.classList.add('hidden');
                        inputRecuperacion.required = false;
                        inputRecuperacion.value = '';
                    }

                    currentRowNumber = d.rowNumber;
                    document.getElementById('alertaEdicion').classList.remove('hidden');
                    const btnSubmit = document.getElementById('btnSubmit');
                    btnSubmit.classList.remove('bg-brand-dark', 'hover:bg-brand-blue');
                    btnSubmit.classList.add('bg-brand-cyan', 'hover:bg-blue-400');
                    document.getElementById('btnText').textContent = "Actualizar Registro";
                    showToast("Registro encontrado.", "success");
                } else {
                    showToast("Cédula no encontrada en la base de datos.", "error");
                }
            } catch (error) {
                showToast("Error al buscar. Revise su conexión.", "error");
            } finally {
                btnBuscar.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>`;
            }
        }

        function cancelarEdicion() {
            currentRowNumber = null;
            document.getElementById('leadForm').reset();
            inicializarFormulario();
            divRecuperacion.classList.add('hidden');
            inputRecuperacion.required = false;
            
            document.getElementById('alertaEdicion').classList.add('hidden');
            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.classList.remove('bg-brand-cyan', 'hover:bg-blue-400');
            btnSubmit.classList.add('bg-brand-dark', 'hover:bg-brand-blue');
            document.getElementById('btnText').textContent = "Guardar Registro";
        }

        document.getElementById('leadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btnSubmit = document.getElementById('btnSubmit');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const feedback = document.getElementById('formFeedback');

            btnSubmit.disabled = true;
            btnText.textContent = currentRowNumber ? "Actualizando..." : "Guardando...";
            btnSpinner.classList.remove('hidden');
            feedback.classList.add('hidden');
            
            const actionType = currentRowNumber ? 'update' : 'create';
            
            const formData = {
                action: actionType,
                rowNumber: currentRowNumber,
                idConsulta: document.getElementById('idConsulta').value,
                fechaRegistro: document.getElementById('fechaRegistro').value,
                numPOPC: document.getElementById('numPOPC').value,
                puntajeCIFIN: document.getElementById('puntajeCIFIN').value,
                validacionCIFIN: document.getElementById('validacionCIFIN').value,
                empresa: document.getElementById('empresa').value,
                sector: document.getElementById('sector').value,
                cedula: document.getElementById('cedula').value,
                nombre: document.getElementById('nombre').value,
                telefono: document.getElementById('telefono').value,
                numOPC: document.getElementById('numOPC').value,
                notas: document.getElementById('notas').value,
                estado: document.getElementById('estado').value,
                fechaRecuperacion: document.getElementById('fechaRecuperacion').value
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });
                const result = await response.json();

                if (result.status === 'success') {
                    showToast(currentRowNumber ? "¡Registro actualizado exitosamente!" : "¡Registro guardado exitosamente!", "success");
                    
                    if(!currentRowNumber) {
                        const date = new Date();
                        const prefix = date.getFullYear().toString() + String(date.getMonth() + 1).padStart(2, '0') + String(date.getDate()).padStart(2, '0');
                        let consecutivo = parseInt(localStorage.getItem(`crm_consecutivo_${prefix}`) || 0) + 1;
                        localStorage.setItem(`crm_consecutivo_${prefix}`, consecutivo);
                    }

                    cancelarEdicion();
                    cargarDatosBackend(); // Refrescar tabla
                } else {
                    throw new Error("Error del servidor");
                }
            } catch (error) {
                showToast("Hubo un error al procesar la solicitud.", "error");
            } finally {
                btnSubmit.disabled = false;
                btnText.textContent = currentRowNumber ? "Actualizar Registro" : "Guardar Registro";
                btnSpinner.classList.add('hidden');
            }
        });

        // RENDERIZADO DEL DASHBOARD (Colores Pastel / Insignias)
        function renderizarTabla() {
            const tbody = document.getElementById('tablaCuerpo');
            const filtro = document.getElementById('filtroEstado').value;
            tbody.innerHTML = '';

            const datosFiltrados = filtro === 'Todos' ? datosDashboard : datosDashboard.filter(r => r.estado === filtro);

            if (datosFiltrados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-12 text-center text-sm text-slate-400 font-medium">No hay registros para este filtro.</td></tr>';
                return;
            }

            datosFiltrados.forEach(row => {
                let tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/50 transition-colors";
                
                // Iniciales para Avatar
                let iniciales = "?";
                if(row.nombre) iniciales = row.nombre.substring(0,2).toUpperCase();

                // Estilo de Estado (Pasteles similares a la App de Hábitos)
                let badgeStyle = "bg-slate-100 text-slate-600";
                if(row.estado === "Recuperar") badgeStyle = "bg-rose-100 text-rose-700";
                if(row.estado === "Radicado") badgeStyle = "bg-emerald-100 text-emerald-700";
                if(row.estado === "Reportado") badgeStyle = "bg-amber-100 text-amber-700";

                // Lógica de Semáforo
                let alertaHTML = '<span class="text-slate-300 text-xs font-semibold">-</span>';
                if (row.estado === 'Recuperar' && row.fechaRecuperacion) {
                    const hoy = new Date(); hoy.setHours(0,0,0,0);
                    const rec = new Date(row.fechaRecuperacion); rec.setHours(0,0,0,0);
                    const diffTime = rec - hoy;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    
                    if (diffDays < 0) {
                        alertaHTML = `<span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-bold bg-red-50 text-red-600 border border-red-200">Vencido (${Math.abs(diffDays)}d)</span>`;
                    } else if (diffDays === 0) {
                        alertaHTML = `<span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-bold bg-rose-500 text-white shadow-sm">¡Llamar Hoy!</span>`;
                    } else if (diffDays <= 3) {
                        alertaHTML = `<span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-100 text-amber-800">Pronto (${diffDays}d)</span>`;
                    } else {
                        alertaHTML = `<span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-50 text-emerald-600">A tiempo</span>`;
                    }
                }

                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <div class="h-10 w-10 flex-shrink-0 rounded-full bg-gradient-to-br from-brand-cyan to-brand-blue flex items-center justify-center text-white font-bold text-xs shadow-inner">
                                ${iniciales}
                            </div>
                            <div class="ml-4">
                                <div class="text-sm font-bold text-slate-800">${row.nombre || 'Sin nombre'}</div>
                                <div class="text-[11px] font-semibold text-slate-400">CC: ${row.cedula || '---'}</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-[13px] font-semibold text-slate-600 hidden md:table-cell">${row.empresa || '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-3 py-1 inline-flex text-[11px] leading-5 font-bold rounded-xl ${badgeStyle}">${row.estado || '-'}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap hidden sm:table-cell">${alertaHTML}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
