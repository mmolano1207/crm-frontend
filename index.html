<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Consultas CRM</title>
    <!-- Tailwind CSS vía CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS personalizado mínimo */
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-white rounded-xl shadow-lg p-8 border border-gray-100">
        
        <div class="mb-6 border-b border-gray-100 pb-4">
            <h2 class="text-2xl font-bold text-gray-900">Registro de Nuevo Potencial</h2>
            <p class="text-sm text-gray-500 mt-1">Complete los datos del cliente. Los campos con asterisco son obligatorios.</p>
        </div>

        <form id="leadForm" class="space-y-5">
            
            <!-- Fila 1: Campos automáticos -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ID Consulta</label>
                    <input type="text" id="idConsulta" name="idConsulta" readonly 
                           class="w-full px-4 py-2 bg-gray-100 border border-gray-300 rounded-md focus:outline-none text-gray-500 cursor-not-allowed">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de Registro</label>
                    <input type="text" id="fechaRegistro" name="fechaRegistro" readonly 
                           class="w-full px-4 py-2 bg-gray-100 border border-gray-300 rounded-md focus:outline-none text-gray-500 cursor-not-allowed">
                </div>
            </div>

            <!-- Fila 2: Datos del prospecto y CIFIN -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Número de POPC *</label>
                    <input type="text" id="numPOPC" name="numPOPC" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Puntaje CIFIN *</label>
                    <input type="number" id="puntajeCIFIN" name="puntajeCIFIN" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Validación CIFIN *</label>
                    <select id="validacionCIFIN" name="validacionCIFIN" required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
                        <option value="" disabled selected>Seleccione</option>
                        <option value="Cumple">Cumple</option>
                        <option value="No cumple">No cumple</option>
                        <option value="Cumple con pendiente">Cumple con pendiente</option>
                        <option value="PEPs">PEPs</option>
                    </select>
                </div>
            </div>

            <!-- Fila 3: Empresa (Dinámica) y Sector (Desplegable) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Empresa *</label>
                    <select id="empresa" name="empresa" required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white transition-colors">
                        <option value="" disabled selected>Cargando empresas...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Sector *</label>
                    <select id="sector" name="sector" required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white transition-colors">
                        <option value="" disabled selected>Seleccione el sector</option>
                        <option value="Público">Público</option>
                        <option value="Privado">Privado</option>
                    </select>
                </div>
            </div>

            <!-- Fila 4: Datos personales -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Cédula *</label>
                    <input type="number" id="cedula" name="cedula" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo *</label>
                    <input type="text" id="nombre" name="nombre" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                </div>
            </div>

            <!-- Fila 5: Contacto y OPC -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono *</label>
                    <input type="number" id="telefono" name="telefono" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1"># OPC *</label>
                    <input type="text" id="numOPC" name="numOPC" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                </div>
            </div>

            <!-- Notas -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Notas</label>
                <textarea id="notas" name="notas" rows="3" 
                          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"></textarea>
            </div>

            <!-- Fila 6: Estado y Fecha de Recuperación Dinámica -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 bg-blue-50 p-4 rounded-lg border border-blue-100">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Estado *</label>
                    <select id="estado" name="estado" required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
                        <option value="" disabled selected>Seleccione un estado</option>
                        <option value="Radicado">Radicado</option>
                        <option value="Reportado">Reportado</option>
                        <option value="Sin capacidad">Sin capacidad</option>
                        <option value="Pendiente por Radicar">Pendiente por Radicar</option>
                        <option value="Recuperar">Recuperar</option>
                    </select>
                </div>
                
                <!-- Contenedor oculto por defecto para la fecha -->
                <div id="containerFechaRecuperacion" class="hidden fade-in">
                    <label class="block text-sm font-medium text-blue-800 mb-1">Fecha de Recuperación *</label>
                    <input type="date" id="fechaRecuperacion" name="fechaRecuperacion" 
                           class="w-full px-4 py-2 border border-blue-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white text-gray-700">
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="pt-4 flex items-center justify-between">
                <p id="feedbackMensaje" class="text-sm font-medium opacity-0 transition-opacity duration-300"></p>
                <button type="submit" id="submitBtn" 
                        class="px-6 py-2.5 bg-gray-900 text-white font-medium rounded-lg hover:bg-gray-800 focus:ring-4 focus:ring-gray-300 transition-all flex items-center">
                    <span>Guardar Registro</span>
                    <svg id="spinner" class="animate-spin ml-2 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </div>
        </form>
    </div>

    <script>
        // URL configurada de tu Google Apps Script
        const GOOGLE_APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyXKBS057EN36CPOpa07SyojvGl6wWLVWmfNzKjzAbAD92RH_FtSZpYFpB5e2yvEwd-gg/exec';

        const form = document.getElementById('leadForm');
        const selectEstado = document.getElementById('estado');
        const containerFecha = document.getElementById('containerFechaRecuperacion');
        const inputFecha = document.getElementById('fechaRecuperacion');
        const btnSubmit = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const feedback = document.getElementById('feedbackMensaje');
        const inputId = document.getElementById('idConsulta');
        const inputRegistro = document.getElementById('fechaRegistro');

        // Genera el ID con formato: YYYYMMDD-01
        function generarID() {
            const hoy = new Date();
            const year = hoy.getFullYear();
            const month = String(hoy.getMonth() + 1).padStart(2, '0');
            const day = String(hoy.getDate()).padStart(2, '0');
            const prefijoFecha = `${year}${month}${day}`;

            let contador = localStorage.getItem('crm_contador_id');
            if (!contador) contador = 1;

            const contadorFormateado = String(contador).padStart(2, '0');
            return `${prefijoFecha}-${contadorFormateado}`;
        }

        // Obtiene la fecha actual en formato YYYY-MM-DD
        function obtenerFechaActual() {
            const hoy = new Date();
            const year = hoy.getFullYear();
            const month = String(hoy.getMonth() + 1).padStart(2, '0');
            const day = String(hoy.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function inicializarFormulario() {
            form.reset();
            inputId.value = generarID();
            inputRegistro.value = obtenerFechaActual();
            containerFecha.classList.add('hidden');
            inputFecha.removeAttribute('required');
            inputFecha.value = '';
        }

        // Cargar lista de empresas desde Google Sheets
        async function cargarEmpresas() {
            const selectEmpresa = document.getElementById('empresa');
            try {
                // Hacemos una petición GET a tu script
                const response = await fetch(GOOGLE_APP_SCRIPT_URL);
                const result = await response.json();
                
                if (Array.isArray(result) && result.length > 0) {
                    selectEmpresa.innerHTML = '<option value="" disabled selected>Seleccione una empresa</option>';
                    result.forEach(empresa => {
                        const option = document.createElement('option');
                        option.value = empresa;
                        option.textContent = empresa;
                        selectEmpresa.appendChild(option);
                    });
                } else {
                    selectEmpresa.innerHTML = '<option value="" disabled selected>No hay empresas en la lista</option>';
                }
            } catch (error) {
                console.error("Error al cargar empresas:", error);
                // Si hay un error, lo convertimos en un campo de texto normal para no bloquear el registro
                selectEmpresa.outerHTML = '<input type="text" id="empresa" name="empresa" required placeholder="Escriba la empresa" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">';
            }
        }

        // Mostrar campo "Fecha de Recuperación"
        selectEstado.addEventListener('change', (e) => {
            if (e.target.value === 'Recuperar') {
                containerFecha.classList.remove('hidden');
                inputFecha.setAttribute('required', 'true');
            } else {
                containerFecha.classList.add('hidden');
                inputFecha.removeAttribute('required');
                inputFecha.value = '';
            }
        });

        // Manejar el envío
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (selectEstado.value === 'Recuperar' && !inputFecha.value) {
                mostrarFeedback('Debe ingresar una fecha de recuperación.', 'error');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.classList.add('opacity-75', 'cursor-not-allowed');
            spinner.classList.remove('hidden');
            mostrarFeedback('Enviando datos...', 'info');

            const formData = new FormData(form);
            const dataObject = Object.fromEntries(formData.entries());

            try {
                const response = await fetch(GOOGLE_APP_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(dataObject)
                });

                const result = await response.json();

                if (result.status === "success") {
                    mostrarFeedback('¡Registro guardado exitosamente!', 'success');
                    
                    // Aumentar contador
                    let contadorActual = parseInt(localStorage.getItem('crm_contador_id') || 1);
                    localStorage.setItem('crm_contador_id', contadorActual + 1);

                    inicializarFormulario();
                    // Refrescar empresas en caso de que el select se haya dañado antes
                    if(document.getElementById('empresa').tagName === "INPUT") {
                        document.location.reload(); 
                    }
                } else {
                    throw new Error(result.message || 'Error desconocido');
                }

            } catch (error) {
                console.error('Error al enviar:', error);
                mostrarFeedback('Error de red al guardar los datos.', 'error');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('opacity-75', 'cursor-not-allowed');
                spinner.classList.add('hidden');
                setTimeout(() => {
                    feedback.classList.remove('opacity-100');
                    feedback.classList.add('opacity-0');
                }, 4000);
            }
        });

        function mostrarFeedback(mensaje, tipo) {
            feedback.textContent = mensaje;
            feedback.classList.remove('opacity-0', 'text-green-600', 'text-red-600', 'text-blue-600');
            if (tipo === 'success') feedback.classList.add('opacity-100', 'text-green-600');
            else if (tipo === 'error') feedback.classList.add('opacity-100', 'text-red-600');
            else feedback.classList.add('opacity-100', 'text-blue-600');
        }

        // Arrancar aplicación
        window.onload = () => {
            inicializarFormulario();
            cargarEmpresas();
        };
    </script>
</body>
</html>
